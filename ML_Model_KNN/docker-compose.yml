services:
  ml-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ml-model-api:2.1.3
    container_name: ml_model_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - IRIS_MODEL_PATH=models/knn_pipeline.joblib
      - IRIS_METADATA_PATH=models/model_metadata.json
      - TITANIC_MODEL_PATH=models/titanic_pipeline.joblib
      - TITANIC_METADATA_PATH=models/titanic_metadata.json
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
