[project]
name = "ml-model-api"
version = "2.0.0"
description = "Multi-model ML inference API — Iris (KNN) + Titanic (LinearSVC)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning"
]
