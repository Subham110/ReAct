# 1. Load balancing (Upstream Cluster)
upstream backend_cluster {
    # Least-connections algorithm: routes request to the server with fewest active connections
    least_conn;

    # Backend agent instances
    server agent-backend-1:8001 max_fails=3 fail_timeout=10s;
    server agent-backend-2:8001 max_fails=3 fail_timeout=10s;

    # Keepalive connection pool (reuses open sockets for speed)
    keepalive 32;
}

# RATE LIMITING (10 requests/sec per client IP with burst allowance of 20)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Hide Nginx version for security
    server_tokens off;

    # Maximum request body size (10 MB)
    client_max_body_size 10M;

    # SPA Routing for React application
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. REVERSE PROXY & LOAD BALANCER FOR API    
    location /api/ {
        # Rate Limiting: 10 req/s, burst 20
        limit_req zone=api_limit burst=20 nodelay;

        # Distribute traffic across the load-balanced upstream backend_cluster
        proxy_pass http://backend_cluster;

        # Keep-Alive connection reuse (HTTP/1.1)
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Tolerant timeouts for LLM processing
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Health Check Proxy (unthrottled for monitoring/Docker health checks)
    location /health/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 3. GZIP COMPRESSION FOR STATIC ASSETS (CSS, JS, JSON, SVG)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types 
        text/plain 
        text/css 
        text/javascript 
        application/json 
        application/javascript 
        application/x-javascript 
        image/svg+xml;
}
